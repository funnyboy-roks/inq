[package]
name = "inq"
description = "A tool for executing API queries defined in a plaintext file that can be checked in to version control or managed like any other file."
version.workspace = true
edition.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
testing = ["inq-lang/testing"]

[dependencies]
miette.workspace = true
serde.workspace = true

clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde_json = { version = "1.0.149", features = ["indexmap"] }
anstream = "1.0.0"
owo-colors = "4.3.0"
humantime = "2.3.0"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-humanize = "0.2.3"
cookie = "0.18.1"
fuzzt = { version = "0.3.1", default-features = false, features = ["levenshtein"] }
bytes = "1.11.1"
async-compression = { version = "0.4.42", features = ["tokio", "gzip", "deflate", "brotli", "zstd"] }
futures-util = "0.3.32"
tokio = "1.52.3"
mime_guess = "2.0.5"
base64 = "0.23.0"
hex = "0.4.3"
derive_more = { version = "2.1.1", features = ["full"] }
syntect = "5.3.0"
rustyline = "18.0.1"
fake = "5.1.0"
lipsum = "0.9.1"

inq-lang = { path = "../inq-lang/" }

[dev-dependencies]
inq = { path = ".", features = ["testing"] }
tempfile = "3.27.0"
mockito = "1.7.2"
